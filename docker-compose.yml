name: logistica

services:
  postgres:
    image: postgres:16-alpine
    container_name: logistica-postgres
    environment:
      POSTGRES_DB: logistica
      POSTGRES_USER: logistica
      POSTGRES_PASSWORD: logistica
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistica -d logistica"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
